<!DOCTYPE html>
<html>
<head>
    <title>Simple Emoji Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { font-size: 24px; margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .expected { background: #e8f5e8; }
        .actual { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Emoji Extraction Test</h1>
    
    <h3>Expected Result:</h3>
    <div class="result expected">😄😄👍🧡😃😃🤗🥳🎈💜✨</div>
    
    <h3>Actual Result:</h3>
    <div class="result actual" id="result"></div>
    
    <h3>Debug Info:</h3>
    <div id="debug"></div>

    <script>
        const testChat = `[28.03.22, 03:07:48] siggi GPI: Wer ist da jetzt niedlicher??😄😄👍freue mich sehr über eure  tolle Nachricht. Übrigens: den Vorbesuch hat Christopher übernommen und längst ist Winnie dort eingezogen. 
Macht es gut weiterhin...liebe Grüße Siggi
[29.03.22, 09:29:59] Samuel Weiß: wie schön zu hören! welcome, Winnie 🧡 bis bald! :)
[15.07.22, 09:44:56] Samuel Weiß: ‎Bild weggelassen
[15.07.22, 09:44:57] Samuel Weiß: ‎Bild weggelassen
[15.07.22, 09:44:57] Samuel Weiß: ‎Bild weggelassen
[15.07.22, 09:44:58] Samuel Weiß: ‎Bild weggelassen
[15.07.22, 09:44:58] Samuel Weiß: ‎Bild weggelassen
[15.07.22, 09:46:33] Samuel Weiß: ‎Bild weggelassen
[15.07.22, 10:16:38] siggi GPI: Hallo alle zusammen!!!
Masuren....was ein toller und noch weitgehend unbekannter Urlaubsort....dort muss es schön sein.......
Tolle Fotos und Halley läuft am Schäferhund vorbei....pah...du kannst mir gar nix. Und das Baby ist großartig 😃 noch schöne Tage und gute Heimreise. Danke auch für Urlaubsgrüße 😃🤗 Siggi
[21.07.25, 20:52:07] Samuel Weiß: ‎Video weggelassen
[21.07.25, 20:55:18] Samuel Weiß: ‎Bild weggelassen
[21.07.25, 20:55:18] Samuel Weiß: Liebe Siggi, gestern ist unsere liebe Halley 7 geworden 🥳 🎈 Ganz liebe Grüße aus Berlin und danke nochmal für dieses unfassbar tolle Geschenk 💜✨`;

        function extractEmojis(chatContent) {
            // Simple but effective emoji extraction
            const lines = chatContent.split('\n');
            const emojis = [];
            const debugInfo = [];
            
            lines.forEach((line, index) => {
                // Skip system messages and empty lines
                if (line.trim() === '' || 
                    line.includes('‎Bild weggelassen') || 
                    line.includes('‎Video weggelassen') ||
                    line.includes('image omitted') ||
                    line.includes('video omitted')) {
                    return;
                }
                
                // Extract timestamp and message content
                const messageMatch = line.match(/^\[[\d.,\s:]+\]\s+([^:]+):\s*(.*)$/);
                if (messageMatch) {
                    const messageContent = messageMatch[2];
                    debugInfo.push(`Line ${index}: "${messageContent}"`);
                    
                    // Extract emojis using character code point checking
                    const chars = [...messageContent];
                    const foundEmojis = [];
                    
                    chars.forEach(char => {
                        const code = char.codePointAt(0);
                        // Check if character is in emoji ranges
                        if ((code >= 0x1F600 && code <= 0x1F64F) || // Emoticons
                            (code >= 0x1F300 && code <= 0x1F5FF) || // Misc Symbols and Pictographs
                            (code >= 0x1F680 && code <= 0x1F6FF) || // Transport and Map
                            (code >= 0x1F1E6 && code <= 0x1F1FF) || // Regional indicators
                            (code >= 0x2600 && code <= 0x26FF) ||   // Misc symbols
                            (code >= 0x2700 && code <= 0x27BF) ||   // Dingbats
                            (code >= 0x1F900 && code <= 0x1F9FF) || // Supplemental Symbols and Pictographs
                            (code >= 0x1FA00 && code <= 0x1FA6F)) { // Chess Symbols
                            foundEmojis.push(char);
                            debugInfo.push(`    Found emoji: ${char} (code: ${code.toString(16)})`);
                        }
                    });
                    
                    if (foundEmojis.length > 0) {
                        emojis.push(...foundEmojis);
                    }
                }
            });
            
            // Display debug info
            document.getElementById('debug').innerHTML = debugInfo.map(info => `<div>${info}</div>`).join('');
            
            return emojis.join('');
        }

        // Run the test
        const result = extractEmojis(testChat);
        document.getElementById('result').textContent = result;
        
        // Check if it matches expected
        const expected = '😄😄👍🧡😃😃🤗🥳🎈💜✨';
        if (result === expected) {
            document.getElementById('result').style.background = '#e8f5e8';
            document.getElementById('result').innerHTML += ' ✅ MATCH!';
        } else {
            document.getElementById('result').style.background = '#f5e8e8';
            document.getElementById('result').innerHTML += ' ❌ NO MATCH';
            console.log('Expected:', expected);
            console.log('Got:', result);
            console.log('Expected length:', expected.length);
            console.log('Got length:', result.length);
        }
    </script>
</body>
</html>
