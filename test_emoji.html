<body>

    <button onclick="testExtraction()">Test Extraction</button>

    <script>
        // Current emoji extraction method (from script.js)
        function extractEmojisOld(chatContent) {
            const emojiRegex = /[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F900}-\u{1F9FF}]|[\u{1F018}-\u{1F270}]|[\u{238C}]|[\u{2194}-\u{2199}]|[\u{21A9}-\u{21AA}]|[\u{231A}-\u{231B}]|[\u{23E9}-\u{23EC}]|[\u{23F0}]|[\u{23F3}]|[\u{25FD}-\u{25FE}]|[\u{2614}-\u{2615}]|[\u{2648}-\u{2653}]|[\u{267F}]|[\u{2693}]|[\u{26A1}]|[\u{26AA}-\u{26AB}]|[\u{26BD}-\u{26BE}]|[\u{26C4}-\u{26C5}]|[\u{26CE}]|[\u{26D4}]|[\u{26EA}]|[\u{26F2}-\u{26F3}]|[\u{26F5}]|[\u{26FA}]|[\u{26FD}]|[\u{2705}]|[\u{270A}-\u{270B}]|[\u{2728}]|[\u{274C}]|[\u{274E}]|[\u{2753}-\u{2755}]|[\u{2757}]|[\u{2795}-\u{2797}]|[\u{27B0}]|[\u{27BF}]|[\u{2B1B}-\u{2B1C}]|[\u{2B50}]|[\u{2B55}]/gu;
            
            const lines = chatContent.split('\n');
            const emojis = [];
            const processedMessages = new Set();
            
            lines.forEach(line => {
                if (line.trim() === '' || 
                    line.includes('‎Bild weggelassen') || 
                    line.includes('‎Video weggelassen') ||
                    line.includes('‎Audio weggelassen') ||
                    line.includes('‎Dokument weggelassen') ||
                    line.includes('image omitted') ||
                    line.includes('video omitted') ||
                    line.includes('audio omitted') ||
                    line.includes('document omitted') ||
                    line.includes('Messages and calls are end-to-end encrypted') ||
                    line.includes('Nachrichten und Anrufe sind Ende-zu-Ende-verschlüsselt')) {
                    return;
                }
                
                const messageMatch = line.match(/^\[[\d.,\s:]+\]\s+([^:]+):\s*(.*)$/);
                if (messageMatch) {
                    const messageContent = messageMatch[2];
                    const messageKey = messageContent.trim();
                    
                    if (processedMessages.has(messageKey)) {
                        return;
                    }
                    processedMessages.add(messageKey);
                    
                    const messageEmojis = messageContent.match(emojiRegex);
                    if (messageEmojis) {
                        emojis.push(...messageEmojis);
                    }
                }
            });
            
            return emojis.join('');
        }

        // New improved emoji extraction
        function extractEmojisNew(chatContent) {
            // Much simpler and more comprehensive emoji regex
            // This covers all emoji ranges in a single comprehensive pattern
            const emojiRegex = /[\u{1f300}-\u{1f5ff}\u{1f600}-\u{1f64f}\u{1f680}-\u{1f6ff}\u{1f700}-\u{1f77f}\u{1f780}-\u{1f7ff}\u{1f800}-\u{1f8ff}\u{1f900}-\u{1f9ff}\u{1fa00}-\u{1fa6f}\u{1fa70}-\u{1faff}\u{2600}-\u{26ff}\u{2700}-\u{27bf}]/gu;
            
            const lines = chatContent.split('\n');
            const emojis = [];
            const debugInfo = [];
            
            lines.forEach((line, index) => {
                // Skip system messages and empty lines
                if (line.trim() === '' || 
                    line.includes('‎Bild weggelassen') || 
                    line.includes('‎Video weggelassen') ||
                    line.includes('‎Audio weggelassen') ||
                    line.includes('‎Dokument weggelassen') ||
                    line.includes('image omitted') ||
                    line.includes('video omitted') ||
                    line.includes('audio omitted') ||
                    line.includes('document omitted') ||
                    line.includes('Messages and calls are end-to-end encrypted') ||
                    line.includes('Nachrichten und Anrufe sind Ende-zu-Ende-verschlüsselt')) {
                    return;
                }
                
                // Extract timestamp and message content
                const messageMatch = line.match(/^\[[\d.,\s:]+\]\s+([^:]+):\s*(.*)$/);
                if (messageMatch) {
                    const messageContent = messageMatch[2];
                    debugInfo.push(`Line ${index}: "${messageContent}"`);
                    
                    // Extract emojis from the message
                    const messageEmojis = messageContent.match(emojiRegex);
                    if (messageEmojis) {
                        debugInfo.push(`  Found emojis: ${messageEmojis.join('')}`);
                        emojis.push(...messageEmojis);
                    }
                }
            });
            
            window.debugInfo = debugInfo;
            return emojis.join('');
        }

        function testExtraction() {
            const input = document.getElementById('testInput').value;
            
            // Test current method
            const currentResult = extractEmojisOld(input);
            document.getElementById('currentOutput').textContent = currentResult;
            
            // Test new method
            const newResult = extractEmojisNew(input);
            document.getElementById('newOutput').textContent = newResult;
            
            // Show debug info
            document.getElementById('debugInfo').innerHTML = window.debugInfo.map(info => `<div>${info}</div>`).join('');
        }

        // Auto-test on load
        window.onload = () => testExtraction();
    </script>
</body>
</html>
